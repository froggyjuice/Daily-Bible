name: Daily Bible Scrape & Deploy

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore archived data from gh-pages
        run: |
          git fetch origin gh-pages || true
          mkdir -p output/main output/soon
          if git show origin/gh-pages:data/main/entries.json > /dev/null 2>&1; then
            python3 -c "
          import json, subprocess, pathlib
          for ver in ['main', 'soon']:
              try:
                  res = subprocess.run(['git', 'show', f'origin/gh-pages:data/{ver}/entries.json'], capture_output=True, text=True)
                  if res.returncode != 0: continue
                  for date in json.loads(res.stdout):
                      out_path = pathlib.Path(f'output/{ver}/{date}.md')
                      if out_path.exists(): continue
                      r2 = subprocess.run(['git', 'show', f'origin/gh-pages:data/{ver}/{date}.json'], capture_output=True, text=True)
                      if r2.returncode == 0:
                          out_path.parent.mkdir(parents=True, exist_ok=True)
                          out_path.write_text(json.loads(r2.stdout)['content'], encoding='utf-8')
                          print(f'[복원] {ver}/{date}.md')
              except Exception as e:
                  print(f'[복원 스킵] {ver}: {e}')
          "
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper (오늘 본문 추가)
        run: python scraper.py

      - name: Build static pages (전체 누적 빌드)
        run: python build_pages.py

      - name: Add .nojekyll
        run: touch ./_pages_build/.nojekyll


      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages_build
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          commit_message: "자동 배포: ${{ github.run_id }}"
