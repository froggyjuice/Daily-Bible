<!DOCTYPE html>
<html lang="ko" data-theme="autumn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>매일성경</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="description" content="성서유니온 매일성경 본문 & 해설 자동 스크랩 대시보드" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ── 헤더 ── -->
  <header class="header" id="app-header">

    <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="사이드바 접기/펼치기">&#8249;</button>

    <div class="header-brand">
      <span class="header-cross">✝</span>
      <div>
        <h1 class="header-title" id="header-title-text">매일성경</h1>
        <p class="header-sub">Daily Bible</p>
      </div>
    </div>

    <!-- 버전 토글 -->
    <div class="version-toggle-group" id="version-group" role="group" aria-label="성경 버전 선택">
      <button class="version-btn active" id="version-btn-main" onclick="switchVersion('main')">📖 <span class="version-text">매일성경</span></button>
      <button class="version-btn" id="version-btn-soon" onclick="switchVersion('soon')">🌿 <span class="version-text">매일성경 순</span></button>
    </div>

    <!-- 테마 토글 -->
    <div class="theme-toggle-group" id="theme-group" role="group" aria-label="화면 테마 선택">
      <button class="theme-btn" id="theme-btn-spring" onclick="pickTheme('spring')" title="봄">🌼</button>
      <button class="theme-btn" id="theme-btn-summer" onclick="pickTheme('summer')" title="여름">🐬</button>
      <button class="theme-btn" id="theme-btn-autumn" onclick="pickTheme('autumn')" title="가을">🍂</button>
      <button class="theme-btn" id="theme-btn-winter" onclick="pickTheme('winter')" title="겨울">☃️</button>
    </div>
  </header>

  <!-- ── 메인 레이아웃 ── -->
  <div class="layout">

    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <span class="sidebar-title">📅 스크랩 목록</span>
          <div class="sidebar-header-right">
            <button class="view-btn" id="btn-today" onclick="goToToday()" title="오늘로 가기">오늘</button>
            <div class="view-toggle-group" role="group" aria-label="보기 방식">
              <button class="view-btn active" id="view-btn-list"     onclick="switchView('list')"     title="목록">☰</button>
              <button class="view-btn"        id="view-btn-calendar" onclick="switchView('calendar')" title="캘린더">▦</button>
            </div>
          </div>
        </div>

        <div id="view-list">
          <ul class="date-list" id="date-list">
            <li class="date-item loading-placeholder">로딩 중…</li>
          </ul>
        </div>

        <div id="view-calendar" style="display:none">
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="calPrev()" aria-label="이전 달">&#8249;</button>
            <span class="cal-title" id="cal-title">2026년 7월</span>
            <button class="cal-nav-btn" onclick="calNext()" aria-label="다음 달">&#8250;</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
    </aside>

    <main class="content-area" id="content-area">
      <div class="tab-header" id="tab-header">
        <div class="tab-meta" id="content-meta">날짜를 선택하세요</div>
        <div class="tabs">
          <button class="view-btn" id="btn-refresh" onclick="refreshData()" title="빠진 날짜 스크랩">🔄️</button>
          <!-- 좁은 화면: 책을 넘기듯 본문 ↔ 해설 쪽 이동 -->
          <button class="tab-btn page-pill active" id="pill-haeseol" onclick="goPage('haeseol')">📝 해설</button>
          <button class="tab-btn page-pill"        id="pill-bonmun"  onclick="goPage('bonmun')">📖 본문</button>
        </div>
      </div>
      <div class="refresh-status" id="refresh-status" style="display:none"></div>

      <!-- 본문 바로가기 (날짜 선택 시 표시) -->
      <div class="passage-actions" id="passage-actions" style="display:none">
        <button class="chip" id="btn-audio" onclick="toggleAudio()" title="성서유니온 공식 오디오 (본문낭독 + 해설)" style="display:none">🎧 듣기</button>
        <button class="chip" id="btn-hymn" onclick="playHymn()" title="오늘의 찬송 듣기 (유튜브)" style="display:none">🎵 찬송</button>
        <button class="chip" onclick="searchPassage('youtube')" title="유튜브에서 본문 찾기">▶ 유튜브</button>
        <button class="chip" onclick="searchPassage('web')" title="웹에서 본문 검색">🔍 검색</button>
        <button class="chip" onclick="sharePassage()" title="이 본문 링크 공유">🤝 같이 읽어요</button>
        <button class="chip" id="btn-godpeople" onclick="openGodpeople()" title="갓피플성경 앱에서 읽기" style="display:none">📱 갓피플성경</button>
      </div>

      <!-- 공식 오디오 (🎧 듣기로 열고 닫음) -->
      <div class="audio-bar" id="audio-bar" style="display:none">
        <audio id="qt-audio" controls preload="none"></audio>
        <div class="audio-speaker" id="audio-speaker"></div>
      </div>

      <!-- 책 펼침면: 왼쪽 쪽 = 해설, 오른쪽 쪽 = 본문 (좁은 화면에서는 옆으로 넘김) -->
      <div class="book" id="book">
        <section class="page page-left" id="page-haeseol" aria-label="해설">
          <div class="page-label">📝 해설</div>
          <div class="empty-state" id="empty-haeseol">
            <div class="empty-icon">📝</div>
            <p>좌측에서 날짜를 선택하세요</p>
          </div>
          <div class="markdown-body" id="haeseol-body"></div>
        </section>
        <section class="page page-right" id="page-bonmun" aria-label="본문">
          <div class="page-label">📖 본문</div>
          <div class="empty-state" id="empty-bonmun">
            <div class="empty-icon">📖</div>
            <p>좌측에서 날짜를 선택하세요</p>
          </div>
          <div class="markdown-body" id="bonmun-body"></div>
        </section>
      </div>

      <!-- 아래 도크: 메모 / 나눔 (누를 때마다 열고 닫음) -->
      <div class="dock" id="dock">
        <div class="dock-bar">
          <button class="dock-btn" id="dock-btn-memo"  onclick="toggleDock('memo')">✏️ 메모 <span class="dock-chev">▴</span></button>
          <button class="dock-btn" id="dock-btn-nanum" onclick="toggleDock('nanum')">💬 나눔<span class="tab-badge" id="comment-badge"></span> <span class="dock-chev">▴</span></button>
          <button class="dock-btn" id="dock-btn-bookmarks" onclick="toggleDock('bookmarks')">🔖 책갈피<span class="tab-badge" id="bookmark-badge"></span> <span class="dock-chev">▴</span></button>
        </div>
        <div class="dock-drawer">
          <section class="nanum-section dock-section" id="dock-memo">
            <h3 class="nanum-title">✏️ 내 메모 <small>이 브라우저에만 저장돼요</small></h3>
            <textarea class="nanum-input memo-input" id="memo-input" rows="5"
                      placeholder="오늘 말씀에서 받은 은혜, 적용할 점을 적어보세요" oninput="onMemoInput()" disabled></textarea>
            <div class="nanum-hint" id="memo-status"></div>
          </section>

          <section class="nanum-section dock-section" id="dock-nanum">
            <h3 class="nanum-title">💬 나눔 <small id="comment-count"></small></h3>
            <ul class="comment-list" id="comment-list"></ul>
            <form class="comment-form" id="comment-form" onsubmit="submitComment(event)">
              <input class="nanum-input" id="comment-nick" maxlength="20" placeholder="닉네임" required>
              <textarea class="nanum-input" id="comment-body" maxlength="500" rows="3" placeholder="함께 나누고 싶은 이야기를 남겨주세요" required></textarea>
              <button type="submit" class="login-btn primary" id="comment-submit">등록</button>
            </form>
          </section>

          <section class="nanum-section dock-section" id="dock-bookmarks">
            <h3 class="nanum-title">🔖 책갈피 모아보기 <small id="bookmark-count"></small> <small>이 브라우저에만 저장돼요</small></h3>
            <ul class="bm-list" id="bookmark-list"></ul>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- 암호 입력 모달 (API 가 401 을 돌려주면 표시) -->
  <div class="login-modal-backdrop" id="login-modal-backdrop" style="display:none"></div>
  <form class="login-modal" id="login-modal" style="display:none" onsubmit="submitLogin(event)">
    <div class="login-modal-header">
      <h3>✝ 매일성경</h3>
    </div>
    <div class="login-modal-body">
      <label for="login-password">암호</label>
      <input type="password" class="login-input" id="login-password" autocomplete="current-password" required>
      <p class="login-help">한 번 입력하면 이 브라우저에서는 다시 묻지 않습니다.</p>
      <div class="login-actions">
        <button type="submit" class="login-btn primary" id="login-submit">들어가기</button>
      </div>
      <div class="login-test-result error" id="login-error"></div>
    </div>
  </form>

  <div class="toast-container" id="toast-container"></div>

  <script src="./app.js"></script>
</body>
</html>
